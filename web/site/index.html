<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUI</title>
<meta name="description" content="Native UI components for C: about 150 components with spring motion and keyboard support, running live.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0b0b'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Arial' font-size='18' fill='%23fff'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<script>
  // apply the saved theme before first paint
  try {
    const s = JSON.parse(localStorage.getItem('cui-web-settings') || '{}');
    const m = s.theme || 'system';
    const dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
<script src="catalog.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">C</span>
    <span class="brand-name">CUI</span>
  </a>
  <nav class="topnav" id="topnav">
    <a href="#/" data-nav="home">Overview</a>
    <a href="#/guide/getting-started" data-nav="guide">Guide</a>
    <a href="#/components" data-nav="components">Components</a>
    <a href="#/showcase" data-nav="showcase">Showcase</a>
    <a href="#/apps" data-nav="apps">Apps</a>
  </nav>
  <div class="spacer"></div>
  <button class="search-trigger" id="search-open" aria-label="Search">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search…</span><kbd>Ctrl K</kbd>
  </button>
  <a class="icon-btn" href="https://github.com/yappologistic/CUI" target="_blank" rel="noreferrer" aria-label="Source code" title="Source code">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
  </a>
  <button class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
  <button class="icon-btn" id="settings-open" aria-label="Settings" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="filter-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="filter" id="filter" type="search" placeholder="Filter" aria-label="Filter the sidebar" autocomplete="off">
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast-host" id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/responsive.js"></script>
</body>
</html>
